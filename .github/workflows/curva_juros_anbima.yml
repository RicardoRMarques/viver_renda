name: Coletar Curva de Juros (ANBIMA)

on:
  schedule:
    # A ANBIMA publica a ETTJ do dia no fim da tarde — mesma lógica de
    # horário do robô de CRI/CRA, 5 minutos depois dele pra não disputar
    # o runner no mesmo instante. Minuto não-redondo de propósito (ver
    # comentário igual nos outros robôs: horários "redondos" pegam a
    # fila pesada do GitHub Actions).
    - cron: '20 20 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {}

concurrency:
  group: curva-juros-anbima-diario
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      # Mesma lição do boletim/Debêntures/CRI/CRA: em evento `schedule`
      # o checkout se fixa no SHA de quando o GitHub CRIOU a execução,
      # não de quando ela rodou de verdade — e a fila do Actions atrasa
      # isso em horas.
      - name: Sincronizar com o topo do main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install --upgrade requests

      - name: Coletar a curva de juros (ETTJ) da ANBIMA
        run: python coletar_curva_juros.py

      - name: Commitar e enviar
        run: |
          git config user.name "robo-curva-juros-anbima"
          git config user.email "robo-curva-juros-anbima@users.noreply.github.com"
          git add data/curva-juros.json
          if git diff --cached --quiet; then
            echo "Nada novo — a ANBIMA ainda não publicou a curva de hoje."
          else
            git commit -m "Curva de juros (ANBIMA): atualiza ETTJ prefixada $(date -u -d '-3 hours' '+%d-%m-%Y')"

            # Retry: outros robôs do repo podem ter commitado entre o
            # checkout e agora. Em vez de falhar o job, rebaseia e tenta
            # de novo.
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Tentativa $tentativa falhou, aguardando..."
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
            done
          fi
