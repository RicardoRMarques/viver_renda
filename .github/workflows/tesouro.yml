name: Atualizar Tesouro Direto

# O Tesouro publica as taxas uma vez por dia útil. 12h UTC = 9h BR, depois da
# abertura. Segunda a sexta apenas — fim de semana não tem data-base nova e
# o download é pesado (o CSV é o histórico inteiro desde 2009).
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tesouro
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # o download costuma dominar o tempo
    steps:
      # v5+ roda em Node 24; a v4 ainda aponta para o Node 20, que o
      # GitHub marcou como obsoleto (set/2025) e hoje força para o 24
      # com um aviso em toda execução.
      - uses: actions/checkout@v5

      # mesma coisa: a setup-python só passou para o Node 24 na v6.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Sem dependência externa de propósito: o robô usa só a biblioteca
      # padrão (urllib + csv), lendo o arquivo em fluxo.
      - name: Coletar preços e taxas
        run: python coletar_tesouro.py

      - name: Publicar se mudou
        run: |
          if [ -z "$(git status --porcelain data/tesouro.json data/tesouro-historico.json)" ]; then
            echo "Nada mudou — sem commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tesouro.json data/tesouro-historico.json
          git commit -m "Tesouro Direto: atualiza preços e taxas"

          # Mesma corrida que já acontecia no boletim (coletar-fiis.yml):
          # se outro robô commitar na main entre o checkout e este push
          # (ex: coletar-fiis.yml roda a cada 15 min), o push simples falha
          # porque main avançou. Como esses arquivos são exclusivos deste
          # robô, um rebase normal nunca dá conflito de verdade nos dados —
          # só precisa buscar e reaplicar o commit em cima da main atual.
          tentativas=5
          ok=0
          for i in $(seq 1 $tentativas); do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            echo "Tentativa $i/$tentativas falhou (provável corrida com outro robô), tentando de novo..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Não foi possível publicar o Tesouro Direto após $tentativas tentativas."
            exit 1
          fi
