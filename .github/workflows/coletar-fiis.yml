name: Atualizar Boletim (Notícias, Índices e Ranking)

on:
  schedule:
    # Índices e notícias: todos os dias, a cada 15 minutos, o dia inteiro.
    # Importante: NÃO usar minutos "redondos" (0/15/30/45) — são os mais
    # concorridos de toda a plataforma do GitHub Actions, então a execução
    # entra na fila atrás de milhares de outros workflows do mundo inteiro
    # e pode atrasar ou até ser pulada. Por isso o offset de 4 min.
    - cron: "4,19,34,49 * * * *"
    # Rankings de Ações/FIIs: só 1x por dia, às 12h UTC (9h em Brasília).
    # Consome bem mais requisições (vários lotes de tickers + endpoint
    # Beta de receita), por isso roda separado do restante.
    - cron: "0 12 * * *"
  # Permite rodar manualmente pela aba "Actions" no GitHub. Ao disparar
  # manualmente, sempre atualiza os rankings também (fica marcado abaixo).
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que execuções se empilhem: se uma nova disparar (a cada 15 min)
# enquanto a anterior ainda está rodando/na fila, cancela a mais antiga em
# vez de deixar as duas competindo pelos mesmos runners do plano grátis —
# é justamente isso que causava execuções demorando 40+ min. Como cada
# execução é uma coleta "do zero" (idempotente), cancelar uma execução
# velha em favor de uma mais nova não perde nada.
concurrency:
  group: coletar-boletim
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Trava de segurança: se por algum motivo o script travar de vez (rede
    # pendurada, etc), o GitHub mata o job sozinho depois de 10 min, em vez
    # de ficar preso e atrasando a fila pras próximas execuções.
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar coleta de notícias, índices e (às vezes) ranking
        env:
          HGBRASIL_TOKEN: ${{ secrets.HGBRASIL_TOKEN }}
          # Chave da brapi — usada nos índices de mercado do boletim
          # (Ibovespa, IFIX, Dólar, Euro e Bitcoin). São 4 requisições por
          # execução; a 15 min o dia inteiro dá ~11,5 mil/mês, dentro do
          # limite de 15 mil do plano gratuito. Se faltar, o boletim sai
          # só com Selic/IPCA (BCB) e CPI (BLS).
          VIVERDERENDA_BRAPI: ${{ secrets.VIVERDERENDA_BRAPI }}
          # Alertas de preço: opcionais — se não estiverem configurados nos
          # Secrets do repositório, o robô simplesmente pula essa etapa.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Só ativa a coleta de rankings quando o disparo foi o cron das
          # 12h UTC (1x/dia) ou quando rodou manualmente pela aba Actions.
          COLETAR_RANKING: ${{ (github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: python coletar_hgbrasil.py

      - name: Commitar e enviar noticias.json, indices.json e ranking.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if [ -f indices.json ]; then git add indices.json; fi
          if [ -f ranking.json ]; then git add ranking.json; fi
          # Memória de quais notícias já foram publicadas. Precisa ser
          # commitada: o runner do Actions é descartado no fim do job, e
          # sem persistir o arquivo o robô "esqueceria" tudo a cada
          # execução e voltaria a repetir a mesma manchete.
          if [ -f noticias-historico.json ]; then git add noticias-historico.json; fi
          if git diff --cached --quiet; then
            echo "Sem alterações no boletim, nada para commitar."
          else
            git commit -m "chore: atualizar boletim (notícias, índices, ranking) [skip ci]"
            git pull --rebase origin main
            git push
          fi
