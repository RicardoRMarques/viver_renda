name: TMP - checar certificado fundamentus
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: GET real sem www, com User-Agent de navegador
        run: |
          curl -sS --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o /tmp/resp.html -D /tmp/headers.txt -w "HTTP_STATUS=%{http_code}\n" \
            https://fundamentus.com.br/fii_resultado.php
          echo "=== headers ==="
          cat /tmp/headers.txt
          echo "=== tamanho do body ==="
          wc -c /tmp/resp.html
          echo "=== contém tabela? ==="
          grep -o "<table" /tmp/resp.html | wc -l
          echo "=== primeiros 500 chars ==="
          head -c 500 /tmp/resp.html
