name: Coletar CAPEX/D&A (CVM)

# A CVM só atualiza o ITR/DFP de uma empresa quando ela entrega uma nova
# demonstração (prazo legal de ~45 dias após o fim de cada trimestre) —
# não há motivo pra checar isso mais que 1x/semana. Minuto quebrado de
# propósito (mesmo motivo do boletim.yml e do mercado.yml: evita a fila
# pesada dos horários redondos).
on:
  schedule:
    - cron: '13 13 * * 1'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cvm-capex
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Sem dependência externa: só biblioteca padrão (urllib, csv, zipfile).
      - name: Coletar CAPEX/D&A
        run: python3 coletar_cvm_capex.py

      - name: Publicar se mudou
        run: |
          if [ -z "$(git status --porcelain data/capex-da.json)" ]; then
            echo "Nada mudou — sem commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/capex-da.json
          git commit -m "CAPEX/D&A (CVM): atualiza data/capex-da.json"

          # Mesma corrida já vista no boletim e no Tesouro Direto: se
          # outro robô commitar na main entre o checkout e este push, o
          # push simples falha porque main avançou. Como este arquivo é
          # exclusivo deste robô, o rebase nunca dá conflito de verdade —
          # só precisa reaplicar o commit em cima da main atual.
          tentativas=5
          ok=0
          for i in $(seq 1 $tentativas); do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            echo "Tentativa $i/$tentativas falhou (provável corrida com outro robô), tentando de novo..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Não foi possível publicar CAPEX/D&A após $tentativas tentativas."
            exit 1
          fi
