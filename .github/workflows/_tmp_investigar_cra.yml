name: _tmp_investigar_cra

on:
  workflow_dispatch: {}

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1.48.0
        timeout-minutes: 3
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: node _tmp_investigar_cra.js
        timeout-minutes: 3
