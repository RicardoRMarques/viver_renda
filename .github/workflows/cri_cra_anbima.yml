name: Coletar Taxas de CRI e CRA (ANBIMA)

on:
  schedule:
    # Mesma lógica do horário das Debêntures: a ANBIMA publica o arquivo
    # do dia no fim da tarde. Minuto não-redondo de propósito (mesma
    # razão do boletim/Debêntures/CRI: horários "redondos" pegam a fila
    # pesada do GitHub Actions) — e 5 minutos depois do robô de
    # Debêntures, pra não disputar o runner no mesmo instante.
    - cron: '15 20 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {}

concurrency:
  group: cri-cra-anbima-diario
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      # Mesma lição do boletim/Debêntures/CRI: em evento `schedule` o
      # checkout se fixa no SHA de quando o GitHub CRIOU a execução, não
      # de quando ela rodou de verdade — e a fila do Actions atrasa isso
      # em horas.
      - name: Sincronizar com o topo do main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install --upgrade requests

      - name: Coletar as taxas de CRI/CRA da ANBIMA
        run: python coletar_cri_cra_anbima.py

      - name: Commitar e enviar
        run: |
          git config user.name "robo-cri-cra-anbima"
          git config user.email "robo-cri-cra-anbima@users.noreply.github.com"
          git add data/cri_cra_precos.json
          if git diff --cached --quiet; then
            echo "Nada novo — a ANBIMA ainda não publicou o arquivo de hoje."
          else
            git commit -m "CRI/CRA (ANBIMA): atualiza taxas do mercado secundário $(date -u -d '-3 hours' '+%d-%m-%Y')"

            # Retry: outros robôs do repo podem ter commitado entre o
            # checkout e agora. Em vez de falhar o job, rebaseia e tenta
            # de novo.
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Tentativa $tentativa falhou, aguardando..."
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
            done
          fi
