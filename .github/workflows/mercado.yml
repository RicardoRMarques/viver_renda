name: Coletar Mercado (Ações e FIIs)

on:
  schedule:
    # Roda de madrugada, depois do fechamento do pregão — os fundamentos
    # (P/L, P/VP, margem) não mudam intradiário, então não precisa rodar
    # mais de 1x/dia. Minuto quebrado de propósito (mesmo motivo do
    # boletim.yml: evita a fila pesada em horários redondos).
    - cron: '10 4 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub

concurrency:
  group: coletar-mercado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests pandas lxml

      - name: Rodar robô de coleta
        env:
          HGBRASIL_TOKEN: ${{ secrets.HGBRASIL_TOKEN }}
        run: python coletar_mercado.py

      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mercado-acoes.json mercado-fiis.json
          if git diff --staged --quiet; then
            echo "Sem alterações no mercado, nada para commitar."
            exit 0
          fi
          git commit -m "Atualiza mercado-acoes.json e mercado-fiis.json"

          # Se outro robô (coletar-fiis.yml a cada 15 min, boletim.yml de
          # madrugada etc.) commitar na main entre o checkout e este push,
          # o push direto falha com "fetch first" (visto em 27/10/2026).
          # Mesmo retry com rebase do coletar-fiis.yml: cada execução é só
          # a leitura mais recente da API, sem edição manual nestes
          # arquivos, então o lado de cá sempre pode vencer sem perder
          # nada de real.
          tentativas=5
          ok=0
          for i in $(seq 1 $tentativas); do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            echo "Tentativa $i/$tentativas falhou (provável corrida com outro robô), tentando de novo..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Não foi possível commitar mercado-acoes.json/mercado-fiis.json após $tentativas tentativas."
            exit 1
          fi
