name: _tmp_investigar_cri_python

on:
  workflow_dispatch: {}

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright
        timeout-minutes: 3
      - run: python -m playwright install chromium
        timeout-minutes: 5
      - run: python _tmp_investigar_cri_python.py
        timeout-minutes: 3
