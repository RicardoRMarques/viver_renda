name: Atualizar Índice de Basileia (IF.data / BCB)

# Semanal já basta agora. A fonte mudou: em vez da API OData do Olinda
# (que devolveu HTTP 500 em seis de oito execuções, porque monta a
# resposta na hora), o robô lê os arquivos JSON estáticos da interface
# web do IF.data. Arquivo pronto não engasga.
#
# O dado sai uma vez por trimestre e leva ~3 meses pra ser publicado, então
# segunda-feira de manhã é folga de sobra. Quando não há novidade, o robô
# não toca no arquivo e não gera commit.
on:
  schedule:
    - cron: '0 12 * * 1'      # segunda-feira, 12h UTC = 9h BR
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal = coleta e grava | descobrir-web = reinvestiga a interface web'
        type: choice
        default: normal
        options: [normal, descobrir-web]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Sem pip install: o robô usa só biblioteca padrão, e o IF.data é
      # aberto (não precisa de chave/secret).
      - name: Coletar Basileia
        if: inputs.modo == 'normal' || inputs.modo == ''
        run: python3 coletar_basileia.py

      # Uma requisição por variação, sem repetir: serve pra descobrir se o
      # IF.data está fora do ar pra todo mundo ou só recusando a rede do
      # GitHub Actions. Rodar o MESMO comando no seu computador e comparar
      # é o que responde essa pergunta.
      # Só olha e imprime: procura uma API REST por trás da interface web
      # do IF.data (www3), que é outro serviço e não sofre da instabilidade
      # do Olinda. Não grava nada.
      - name: Investigar a interface web do IF.data
        if: inputs.modo == 'descobrir-web'
        run: python3 descobrir_ifdata_web.py

      - name: Commitar se mudou
        if: inputs.modo == 'normal' || inputs.modo == ''
        run: |
          if [ -n "$(git status --porcelain data/basileia.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/basileia.json
            git commit -m "Basileia: atualiza data/basileia.json (IF.data/BCB)"
            git push
          else
            echo "Nada mudou — nenhum commit."
          fi
