name: Atualizar Índice de Basileia (IF.data / BCB)

# DIÁRIO, não semanal — e o motivo é o servidor, não o dado.
#
# O dado muda uma vez por trimestre, então uma execução bem-sucedida a
# cada três meses basta. Só que o Olinda (a API do BC) responde de forma
# muito intermitente: em oito execuções observadas, duas trouxeram dado e
# seis devolveram HTTP 500 em tudo. Semanal com ~25% de sucesso arrisca
# passar um trimestre inteiro sem atualizar; diário torna quase certo
# pegar uma janela boa em poucos dias.
#
# Custa pouco: quando não há nada novo (ou o servidor está fora), o robô
# não toca no arquivo e não gera commit. Execução malsucedida termina em
# menos de um minuto, por causa do freio.
on:
  schedule:
    - cron: '0 12 * * *'      # todo dia, 12h UTC = 9h BR
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal = coleta e grava | diagnostico = só testa o servidor'
        type: choice
        default: normal
        options: [normal, diagnostico]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Sem pip install: o robô usa só biblioteca padrão, e o IF.data é
      # aberto (não precisa de chave/secret).
      - name: Coletar Basileia
        if: inputs.modo != 'diagnostico'
        run: python3 coletar_basileia.py

      # Uma requisição por variação, sem repetir: serve pra descobrir se o
      # IF.data está fora do ar pra todo mundo ou só recusando a rede do
      # GitHub Actions. Rodar o MESMO comando no seu computador e comparar
      # é o que responde essa pergunta.
      - name: Diagnóstico do servidor
        if: inputs.modo == 'diagnostico'
        run: python3 coletar_basileia.py --diagnostico

      - name: Commitar se mudou
        if: inputs.modo != 'diagnostico'
        run: |
          if [ -n "$(git status --porcelain data/basileia.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/basileia.json
            git commit -m "Basileia: atualiza data/basileia.json (IF.data/BCB)"
            git push
          else
            echo "Nada mudou — nenhum commit."
          fi
