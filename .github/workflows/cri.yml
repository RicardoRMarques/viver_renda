name: Atualizar CRI (Consulta Pública B3)

# A B3 não publica hora fixa de atualização do cadastro — é um registro
# de emissões, que muda devagar (novas séries saem aos poucos, não minuto
# a minuto). Uma vez por dia útil, de manhã, é sobra de folga.
#
# Minuto não-redondo de propósito — mesma razão do boletim e do Tesouro:
# horários "redondos" pegam a fila pesada do GitHub Actions.
on:
  schedule:
    - cron: '47 9 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {}

concurrency:
  group: cri-diario
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      # Mesma lição do boletim/Debêntures: em evento `schedule` o checkout
      # se fixa no SHA de quando o GitHub CRIOU a execução, não de quando
      # ela rodou de verdade — e a fila do Actions atrasa isso em horas.
      - name: Sincronizar com o topo do main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Sem --with-deps: os pacotes extras que ele instala (fontes CJK,
      # xfonts...) não fazem falta pra um Chromium headless usado só pra
      # buscar dados, e numa execução real o mirror do apt já se mostrou
      # lento o bastante pra travar o --with-deps sozinho (ver histórico
      # desta branch). As libs que o Chromium realmente precisa já vêm
      # na imagem ubuntu-latest.
      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Coletar o cadastro de CRIs da B3
        run: python coletar_cri.py

      - name: Commitar e enviar
        run: |
          git config user.name "robo-cri"
          git config user.email "robo-cri@users.noreply.github.com"
          git add data/cri.json
          if git diff --cached --quiet; then
            echo "Nada novo — cadastro sem mudança desde a última coleta."
          else
            git commit -m "CRI: atualiza cadastro de emissão da B3 $(date -u -d '-3 hours' '+%d-%m-%Y')"

            # Retry: outros robôs do repo (índices a cada 15 min, boletim,
            # tesouro, debêntures, basileia) podem ter commitado entre o
            # checkout e agora. Em vez de falhar o job, rebaseia e tenta de novo.
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Tentativa $tentativa falhou, aguardando..."
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
            done
          fi
