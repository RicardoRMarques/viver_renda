name: Coletar Boletim Focus (BCB)

on:
  schedule:
    # A API do BCB atualiza a mediana todo dia útil (confirmado contra
    # dados reais em 17/11/2026). Roda 5 minutos depois da curva de
    # juros pra não disputar o runner no mesmo instante — minuto
    # não-redondo de propósito, mesma lógica dos outros robôs.
    - cron: '25 20 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {}

concurrency:
  group: boletim-focus-bcb-diario
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      # Mesma lição do boletim/Debêntures/CRI/CRA/curva de juros: em
      # evento `schedule` o checkout se fixa no SHA de quando o GitHub
      # CRIOU a execução, não de quando ela rodou de verdade — e a fila
      # do Actions atrasa isso em horas.
      - name: Sincronizar com o topo do main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install --upgrade requests

      - name: Coletar o Boletim Focus (BCB)
        run: python coletar_boletim_focus.py

      - name: Commitar e enviar
        run: |
          git config user.name "robo-boletim-focus-bcb"
          git config user.email "robo-boletim-focus-bcb@users.noreply.github.com"
          git add data/boletim-focus.json
          if git diff --cached --quiet; then
            echo "Nada novo — o BCB ainda não publicou a mediana de hoje."
          else
            git commit -m "Boletim Focus (BCB): atualiza mediana das expectativas $(date -u -d '-3 hours' '+%d-%m-%Y')"

            # Retry: outros robôs do repo podem ter commitado entre o
            # checkout e agora. Em vez de falhar o job, rebaseia e tenta
            # de novo.
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Tentativa $tentativa falhou, aguardando..."
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
            done
          fi
