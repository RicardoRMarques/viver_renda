name: Gerar Boletim de Mercado Diário

on:
  schedule:
    # Com o suporte nativo a timezone do GitHub Actions (desde mar/2026),
    # não precisa mais converter pra UTC na mão — escreve direto no
    # horário de Brasília. Roda 3h05 (de propósito, minuto não-redondo —
    # evita a fila pesada que o GitHub Actions tem em horários "redondos"
    # como 3h00), de segunda (1) a sexta (5).
    - cron: '5 3 * * 1-5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub

# Evita que duas execuções rodem ao mesmo tempo e briguem pelo commit
concurrency:
  group: boletim-diario
  cancel-in-progress: false

jobs:
  gerar-boletim:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necessário para commitar o boletim de volta no repo

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 traz todo o histórico (o passo seguinte precisa
          # dele para o reset). Ele NÃO garante, sozinho, que estamos no
          # commit mais recente — ver o passo abaixo.
          fetch-depth: 0

      # -----------------------------------------------------------------
      # Por que este passo existe (bug de 17/09/2026):
      #
      # Em evento `schedule`, o actions/checkout se fixa no SHA do momento
      # em que o GitHub CRIOU a execução — não no momento em que ela
      # rodou. E a fila do Actions atrasa esse intervalo em horas: o cron
      # aqui é 3h05, mas os boletins reais saíram às 6h10, 8h24, 9h36,
      # 10h19... Enquanto isso o robô de coleta commita a cada 15 min, e
      # nada disso chega ao runner.
      #
      # Resultado observado: o boletim de 17/09 saiu com a Selic em 14,00%
      # (o Copom já tinha cortado para 13,75% na véspera) e com o
      # fechamento do dia 15 — cópia carbono do boletim do dia 16.
      #
      # O reset abaixo joga a árvore de trabalho no que main REALMENTE tem
      # agora, segundos antes de gerar. É `--hard` sem dó porque não há
      # nada local a preservar: o checkout acabou de acontecer e nenhum
      # passo escreveu nada ainda.
      # -----------------------------------------------------------------
      - name: Sincronizar com o topo do main (indices/noticias/ranking mais recentes)
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Árvore sincronizada com origin/main em $(git log -1 --format='%h %ci')"
          echo "Coleta mais recente no indices.json: $(grep -o '"coletado_em": "[^"]*"' indices.json | tail -1)"

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*' # sempre usa a LTS vigente, evitando ficar preso a uma versão depreciada

      # -----------------------------------------------------------------
      # indices.json, noticias.json e ranking.json vêm do robô de coleta,
      # que roda a cada 15 min o dia inteiro (sem pausa) — então em
      # qualquer horário há dado fresco disponível. O passo de sincronia
      # acima garante que é ESSE dado que chega aqui.
      #
      # Segunda linha de defesa, dentro do próprio script: ele confere o
      # `coletado_em` do indices.json e, se ainda assim vier coisa velha,
      # busca a cópia publicada no site; se ela também estiver velha, o
      # script ABORTA (exit 1) em vez de publicar números errados. Ou
      # seja: workflow vermelho e e-mail de falha, nunca um boletim com a
      # Selic de ontem indo para os assinantes.
      # -----------------------------------------------------------------
      - name: Gerar o boletim do dia
        env:
          # Notificação por e-mail dos assinantes do boletim (opt-in) —
          # mesmas credenciais já usadas pelo robô de Alertas de Preço.
          # Se não estiverem configuradas, o script pula essa etapa sozinho.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node robo-boletim/gerar-boletim.js

      - name: Commitar e enviar o boletim gerado
        run: |
          git config user.name "robo-boletim"
          git config user.email "robo-boletim@users.noreply.github.com"
          git add boletins/
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Nada novo para commitar (o boletim de hoje já existia)."
          else
            git commit -m "Boletim de Mercado: $(date -u -d '-3 hours' '+%d-%m-%Y')"

            # Retry: se outro commit (push manual, ou outro robô do repo,
            # ex: coleta-reinv-yahoo) chegou no main entre o checkout e
            # agora, o push é rejeitado (non-fast-forward). Em vez de
            # falhar o job direto, busca o que há de novo, reaplica o
            # commit do boletim por cima, e tenta de novo — até 3x.
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Tentativa $tentativa falhou, aguardando antes de tentar de novo..."
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
            done
          fi
